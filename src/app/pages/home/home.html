<section class="home-hero">
  <div class="hero-shell">
    <div class="hero-copy">
      <span class="hero-badge">Portfolio Profesional</span>
      <h1>Ndertoj produkte web te pastra, te shpejta dhe serioze.</h1>
      <p>
        I fokusuar te saktësia arkitekturore dhe UI modern, i orientuar drejt implementimeve teknike
        që performojnë në mjedise reale prodhimi.
      </p>

      <div class="hero-actions">
        <a [routerLink]="['/projekte']" class="btn-primary">Shiko Projektet</a>
        <a
          href="https://github.com/XhoniGjermeni1"
          target="_blank"
          rel="noreferrer"
          class="btn-ghost"
          >GitHub Profile</a
        >
      </div>

      <div class="hero-metrics">
        <div class="metric">
          <strong>100%</strong>
          <span>Kod i tipizuar</span>
        </div>
        <div class="metric">
          <strong>24/7</strong>
          <span>Pasion per zhvillim</span>
        </div>
      </div>
    </div>

    <div class="hero-visual" aria-hidden="true">
      <div class="blob-shadow"></div>
      <div class="blob-animation"></div>
    </div>
  </div>
</section>
